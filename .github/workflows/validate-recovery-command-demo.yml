name: Validate Recovery Command Demo

on:
  push:
    branches:
      - feature/recovery-command-demo

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python and template syntax
        run: |
          python -m py_compile app.py features.py notifications.py bootstrap.py
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          Environment().parse(Path('templates/recovery.html').read_text())
          print('validation ok')
          PY
