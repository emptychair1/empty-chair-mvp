name: Patch notifications Resend sender v2

on:
  push:
    branches:
      - fix/notifications-resend-sdk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notifications-resend-sdk

      - name: Patch notifications.py
        env:
          SEND_EMAIL_B64: 
        run: python -c 'import os,base64; from pathlib import Path; p=Path("notifications.py"); t=p.read_text(); t=t.replace("import urllib.error\nimport urllib.request\n",""); s=t.find("def send_email(to_email, subject, html):"); e=t.find("\ndef _send_text",s); assert s!=-1 and e!=-1; r=base64.b64decode(os.environ["SEND_EMAIL_B64"]).decode(); t=t[:s]+r+t[e+1:]; compile(t,"notifications.py","exec"); p.write_text(t)'

      - name: Validate
        run: |
          python -m py_compile notifications.py
          grep -n 'return core.send_email' notifications.py
          if grep -n 'api.resend.com/emails' notifications.py; then exit 1; fi

      - name: Remove one-time workflows
        run: |
          rm -f .github/workflows/patch-notifications-resend.yml
          rm -f .github/workflows/patch-notifications-resend-v2.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- notifications.py .github/workflows/patch-notifications-resend.yml .github/workflows/patch-notifications-resend-v2.yml
          git diff --cached --check
          git commit -m "fix: route notification emails through Resend SDK"
          git push origin HEAD:fix/notifications-resend-sdk
