name: Fix notification email recursion

on:
  push:
    branches:
      - fix/notifications-recursion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'fix/notifications-recursion';
            const path = 'notifications.py';
            const file = await github.rest.repos.getContent({owner, repo, path, ref: branch});
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');
            if (!text.includes('_ORIGINAL_SEND_EMAIL = core.send_email')) {
              text = text.replace('_PATCHED = False\n', '_PATCHED = False\n_ORIGINAL_SEND_EMAIL = core.send_email\n', 1);
            }
            text = text.replace('return core.send_email(to_email, subject, html)', 'return _ORIGINAL_SEND_EMAIL(to_email, subject, html)');
            if (!text.includes('_ORIGINAL_SEND_EMAIL = core.send_email')) core.setFailed('original sender reference missing');
            if (!text.includes('return _ORIGINAL_SEND_EMAIL(to_email, subject, html)')) core.setFailed('saved sender call missing');
            if (text.includes('return core.send_email(to_email, subject, html)')) core.setFailed('recursive sender call still present');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, branch, message: 'fix: prevent notification email recursion', content: Buffer.from(text).toString('base64'), sha: file.data.sha});
