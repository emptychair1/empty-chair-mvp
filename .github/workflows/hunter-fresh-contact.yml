name: Hunter Fresh Contact + Pain Leads

on:
  push:
    paths:
      - 'hunter/fresh_contact_bucket.py'
      - 'hunter/test_fresh_contact_bucket.py'
      - 'hunter/fresh_pain_verifier.py'
      - 'hunter/test_fresh_pain_verifier.py'
      - 'hunter/indexed_fresh_pain.py'
      - 'hunter/test_indexed_fresh_pain.py'
      - '.github/workflows/hunter-fresh-contact.yml'
  pull_request:
    paths:
      - 'hunter/fresh_contact_bucket.py'
      - 'hunter/test_fresh_contact_bucket.py'
      - 'hunter/fresh_pain_verifier.py'
      - 'hunter/test_fresh_pain_verifier.py'
      - 'hunter/indexed_fresh_pain.py'
      - 'hunter/test_indexed_fresh_pain.py'
      - '.github/workflows/hunter-fresh-contact.yml'
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-fresh-contact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hunter/requirements.txt

      - name: Install Hunter dependencies
        run: pip install -r hunter/requirements.txt

      - name: Test fresh contact and pain pipeline
        working-directory: hunter
        run: pytest -q test_fresh_contact_bucket.py test_fresh_pain_verifier.py test_indexed_fresh_pain.py

      - name: Compile fresh lead modules
        run: python -m py_compile hunter/fresh_contact_bucket.py hunter/fresh_pain_verifier.py hunter/indexed_fresh_pain.py

      - name: Fill fresh contact bucket
        run: python hunter/fresh_contact_bucket.py --out hunter-fresh-contact-bucket.json

      - name: Enforce bucket freshness and volume
        run: |
          python - <<'PY'
          import json, sys
          p = json.load(open('hunter-fresh-contact-bucket.json'))
          m = p.get('metrics', {})
          artists = p.get('artists', [])
          stale = [a for a in artists if not a.get('fresh_activity')]
          print(f"Hunter fresh bucket: {m.get('unique_artists', 0)} unique artists; {m.get('contactable_artists', 0)} contactable; {m.get('direct_contact_artists', 0)} direct-contact")
          if stale:
              print(f"FAIL: {len(stale)} stale artists escaped the freshness gate")
              sys.exit(1)
          if m.get('unique_artists', 0) < 100:
              print('WARN: bucket is below the 100-artist live target')
          PY

      - name: Verify <=72h pain on public business pages
        run: |
          python hunter/fresh_pain_verifier.py \
            --bucket hunter-fresh-contact-bucket.json \
            --out hunter-fresh-pain-leads.json \
            --workers 12 \
            --timeout 10

      - name: Search indexed public web for <=72h pain
        run: |
          python hunter/indexed_fresh_pain.py \
            --bucket hunter-fresh-contact-bucket.json \
            --out hunter-indexed-fresh-pain.json \
            --workers 16 \
            --timeout 8

      - name: Measure combined 100-fresh-lead target
        run: |
          python - <<'PY'
          import json
          direct = json.load(open('hunter-fresh-pain-leads.json'))
          indexed = json.load(open('hunter-indexed-fresh-pain.json'))
          usernames = {str(x.get('username') or '').lower() for x in direct.get('leads', []) if x.get('username')}
          usernames |= {str(x.get('username') or '').lower() for x in indexed.get('leads', []) if x.get('username')}
          count = len(usernames)
          target = 100
          print(f"Hunter combined verified fresh pain leads: {count}/{target}")
          print(f"- direct page verifier: {direct.get('metrics', {}).get('verified_fresh_pain_leads', 0)}")
          print(f"- indexed public web: {indexed.get('metrics', {}).get('verified_fresh_pain_leads', 0)}")
          if count < target:
              print(f"FAIL TARGET (non-blocking): short by {target-count}. Do not call the goal achieved.")
          else:
              print('PASS TARGET: Hunter produced at least 100 unique verified fresh pain leads.')
          PY

      - name: Publish bucket summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print('## Hunter fresh lead funnel')
          if os.path.exists('hunter-fresh-contact-bucket.json'):
              m = json.load(open('hunter-fresh-contact-bucket.json')).get('metrics', {})
              print(f"- unique active artists: {m.get('unique_artists', 0)}")
              print(f"- contactable artists: {m.get('contactable_artists', 0)}")
              print(f"- direct public email/booking contacts: {m.get('direct_contact_artists', 0)}")
          direct = json.load(open('hunter-fresh-pain-leads.json')) if os.path.exists('hunter-fresh-pain-leads.json') else {}
          indexed = json.load(open('hunter-indexed-fresh-pain.json')) if os.path.exists('hunter-indexed-fresh-pain.json') else {}
          print(f"- direct-page <=72h pain: {direct.get('metrics', {}).get('verified_fresh_pain_leads', 0)}")
          print(f"- indexed-web <=72h pain: {indexed.get('metrics', {}).get('verified_fresh_pain_leads', 0)}")
          users = {str(x.get('username') or '').lower() for x in direct.get('leads', []) if x.get('username')}
          users |= {str(x.get('username') or '').lower() for x in indexed.get('leads', []) if x.get('username')}
          print(f"- combined unique verified <=72h pain leads: {len(users)} / 100")
          print('- no timestamp or identity match = not counted')
          PY

      - name: Upload fresh lead artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-fresh-leads-${{ github.run_id }}
          path: |
            hunter-fresh-contact-bucket.json
            hunter-fresh-pain-leads.json
            hunter-indexed-fresh-pain.json
          if-no-files-found: warn
          retention-days: 14
