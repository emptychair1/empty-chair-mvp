name: Hunter Fresh Contact + Pain Leads

on:
  push:
    paths:
      - 'hunter/fresh_contact_bucket.py'
      - 'hunter/test_fresh_contact_bucket.py'
      - 'hunter/fresh_pain_verifier.py'
      - 'hunter/test_fresh_pain_verifier.py'
      - '.github/workflows/hunter-fresh-contact.yml'
  pull_request:
    paths:
      - 'hunter/fresh_contact_bucket.py'
      - 'hunter/test_fresh_contact_bucket.py'
      - 'hunter/fresh_pain_verifier.py'
      - 'hunter/test_fresh_pain_verifier.py'
      - '.github/workflows/hunter-fresh-contact.yml'
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-fresh-contact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hunter/requirements.txt

      - name: Install Hunter dependencies
        run: pip install -r hunter/requirements.txt

      - name: Test fresh contact and pain pipeline
        working-directory: hunter
        run: pytest -q test_fresh_contact_bucket.py test_fresh_pain_verifier.py

      - name: Compile fresh lead modules
        run: python -m py_compile hunter/fresh_contact_bucket.py hunter/fresh_pain_verifier.py

      - name: Fill fresh contact bucket
        run: python hunter/fresh_contact_bucket.py --out hunter-fresh-contact-bucket.json

      - name: Enforce bucket freshness and volume
        run: |
          python - <<'PY'
          import json, sys
          p = json.load(open('hunter-fresh-contact-bucket.json'))
          m = p.get('metrics', {})
          artists = p.get('artists', [])
          stale = [a for a in artists if not a.get('fresh_activity')]
          print(f"Hunter fresh bucket: {m.get('unique_artists', 0)} unique artists; {m.get('contactable_artists', 0)} contactable; {m.get('direct_contact_artists', 0)} direct-contact")
          if stale:
              print(f"FAIL: {len(stale)} stale artists escaped the freshness gate")
              sys.exit(1)
          if m.get('unique_artists', 0) < 100:
              print('WARN: bucket is below the 100-artist live target; discovery needs more fresh roster sources')
          PY

      - name: Verify <=72h pain on public business pages
        run: |
          python hunter/fresh_pain_verifier.py \
            --bucket hunter-fresh-contact-bucket.json \
            --out hunter-fresh-pain-leads.json \
            --workers 12 \
            --timeout 10

      - name: Measure 100-fresh-lead target
        run: |
          python - <<'PY'
          import json
          p = json.load(open('hunter-fresh-pain-leads.json'))
          m = p.get('metrics', {})
          count = int(m.get('verified_fresh_pain_leads', 0))
          target = int(m.get('target_fresh_leads', 100))
          print(f"Hunter fresh pain leads: {count}/{target}; direct-contact={m.get('verified_direct_contact_leads', 0)}")
          if count < target:
              print(f"FAIL TARGET (non-blocking): Hunter is short by {target-count} verified fresh pain leads. Do not call the lead goal achieved.")
          else:
              print('PASS TARGET: Hunter produced at least 100 verified fresh pain leads.')
          PY

      - name: Publish bucket summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          print('## Hunter fresh lead funnel')
          if os.path.exists('hunter-fresh-contact-bucket.json'):
              p = json.load(open('hunter-fresh-contact-bucket.json'))
              m = p.get('metrics', {})
              print(f"- unique active artists: {m.get('unique_artists', 0)}")
              print(f"- contactable artists: {m.get('contactable_artists', 0)}")
              print(f"- direct public email/booking contacts: {m.get('direct_contact_artists', 0)}")
              print('- stale activity policy: event/roster activity expires 7 days after event end')
          if os.path.exists('hunter-fresh-pain-leads.json'):
              p = json.load(open('hunter-fresh-pain-leads.json'))
              m = p.get('metrics', {})
              print(f"- verified <=72h pain leads: {m.get('verified_fresh_pain_leads', 0)} / target {m.get('target_fresh_leads', 100)}")
              print(f"- verified pain leads with direct public email/booking contact: {m.get('verified_direct_contact_leads', 0)}")
              print('- no timestamp = not counted as fresh pain')
          PY

      - name: Upload fresh lead artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunter-fresh-leads-${{ github.run_id }}
          path: |
            hunter-fresh-contact-bucket.json
            hunter-fresh-pain-leads.json
          if-no-files-found: warn
          retention-days: 14
