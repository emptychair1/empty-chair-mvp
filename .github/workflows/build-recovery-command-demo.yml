name: Build Recovery Command Demo

on:
  push:
    branches:
      - feature/recovery-command-demo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DEMO_ENDPOINT_B64: 
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'feature/recovery-command-demo';

            const featureFile = await github.rest.repos.getContent({owner, repo, path: 'features.py', ref: branch});
            let features = Buffer.from(featureFile.data.content, 'base64').toString('utf8');
            features = features.replace(
              'def recovery_page(request: Request):',
              'def recovery_page(request: Request, demo_launched: int = 0):'
            );
            features = features.replace(
              '            "campaigns": campaigns,\n',
              '            "campaigns": campaigns,\n            "demo_mode": core.DEMO_MODE,\n            "demo_launched": bool(demo_launched),\n'
            );
            if (!features.includes('@app.post("/demo/launch-recovery")')) {
              features = features.trimEnd() + '\n' + Buffer.from(process.env.DEMO_ENDPOINT_B64, 'base64').toString('utf8');
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'features.py', branch,
              message: 'feat: add one-click demo recovery launcher',
              content: Buffer.from(features).toString('base64'),
              sha: featureFile.data.sha
            });

            const recoveryFile = await github.rest.repos.getContent({owner, repo, path: 'templates/recovery.html', ref: branch});
            let recovery = Buffer.from(recoveryFile.data.content, 'base64').toString('utf8');
            recovery = recovery.replace(
              '</style>',
              '.demo-launch-card{margin-bottom:18px;padding:18px;border:1px solid rgba(225,38,38,.45);border-radius:12px;background:radial-gradient(circle at 15% 0,rgba(225,38,38,.14),transparent 280px),#0b0b0b}.demo-launch-card strong{font-family:\'Cinzel\',Georgia,serif;color:var(--cream)}.demo-launch-card p{margin:5px 0 0;color:var(--cream-dim);font-size:12px}.campaign-pulse-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0}.campaign-pulse{padding:11px 12px;border:1px solid var(--line-soft);border-radius:8px;background:#090909}.campaign-pulse b{display:block;color:var(--gold-light);font-size:9px;letter-spacing:.1em;text-transform:uppercase}.campaign-pulse span{display:block;margin-top:5px;font-family:\'Cinzel\',Georgia,serif;font-size:20px;color:var(--cream)}.wave-label{margin-top:16px;color:var(--red-bright);font-size:10px;letter-spacing:.16em;text-transform:uppercase}@media(max-width:700px){.campaign-pulse-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}\n</style>'
            );
            recovery = recovery.replace(
              '<div class="top-actions"><a class="button" href="/#create-opening">＋ New Opening</a></div>',
              '<div class="top-actions">{% if demo_mode %}<form method="post" action="/demo/launch-recovery" style="margin:0"><button class="button" type="submit">⚡ Test Demo Campaign</button></form>{% endif %}<a class="button secondary" href="/#create-opening">＋ New Opening</a></div>'
            );
            recovery = recovery.replace(
              '<div class="content">\n',
              '<div class="content">\n{% if demo_mode %}<section class="demo-launch-card"><strong>Demo test launcher</strong><p>Creates a fresh $250 opening, five isolated test customers using your login email, scores them, launches the queue, and sends the first real test offer. This control disappears when demo mode is off.</p></section>{% endif %}\n{% if demo_launched %}<div class="intel-note" style="margin:0 0 18px;border-left-color:var(--green)"><strong>Demo campaign launched.</strong> The opening and recovery queue below were created automatically.</div>{% endif %}\n'
            );
            recovery = recovery.replace(
              '{% set queue_done = campaign.offers|selectattr(\'status\',\'in\',[\'DECLINED\',\'EXPIRED\',\'FAILED\',\'CANCELLED\',\'CLAIMED\'])|list|length %}',
              '{% set queue_done = campaign.offers|selectattr(\'status\',\'in\',[\'DECLINED\',\'EXPIRED\',\'FAILED\',\'CANCELLED\',\'CLAIMED\'])|list|length %}\n{% set sent_total = campaign.offers|selectattr(\'sent_at\')|list|length %}\n{% set opened_total = campaign.offers|selectattr(\'opened_at\')|list|length %}\n{% set claimed_total = campaign.offers|selectattr(\'status\',\'equalto\',\'CLAIMED\')|list|length %}'
            );
            recovery = recovery.replace(
              '</div>\n\n{% if campaign.active %}',
              '</div>\n<div class="campaign-pulse-grid"><div class="campaign-pulse"><b>Best Matches</b><span>{{ queue_total }}</span></div><div class="campaign-pulse"><b>Offers Sent</b><span>{{ sent_total }}</span></div><div class="campaign-pulse"><b>Opened</b><span>{{ opened_total }}</span></div><div class="campaign-pulse"><b>Claimed</b><span>{{ claimed_total }}</span></div></div>\n<div class="wave-label">Wave 1 · ranked recovery queue</div>\n\n{% if campaign.active %}'
            );
            recovery = recovery.replace(' · SMS sent</div>', ' · Delivery active</div>');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'templates/recovery.html', branch,
              message: 'feat: upgrade recovery command center UI',
              content: Buffer.from(recovery).toString('base64'),
              sha: recoveryFile.data.sha
            });

            const workflow = await github.rest.repos.getContent({owner, repo, path: '.github/workflows/build-recovery-command-demo.yml', ref: branch});
            await github.rest.repos.deleteFile({
              owner, repo, path: '.github/workflows/build-recovery-command-demo.yml', branch,
              message: 'chore: remove one-time recovery feature workflow',
              sha: workflow.data.sha
            });
