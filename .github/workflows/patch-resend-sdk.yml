name: Switch Empty Chair to Resend SDK

on:
  push:
    branches:
      - fix/resend-sdk

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/resend-sdk

      - name: Patch app and requirements
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("app.py")
          req_path = Path("requirements.txt")

          text = app_path.read_text()

          if "import resend\n" not in text:
              marker = "import secrets\n"
              if marker not in text:
                  raise SystemExit("Could not find import insertion point")
              text = text.replace(marker, marker + "import resend\n", 1)

          start = text.find("def send_email(to_email, subject, html):")
          end = text.find("\ndef send_welcome_email", start)
          if start == -1 or end == -1:
              raise SystemExit("Could not locate send_email function")

          replacement = '''def send_email(to_email, subject, html):
    to_email = normalize_email(to_email)

    if not to_email:
        return False

    if DEMO_MODE and not RESEND_API_KEY:
        print()
        print("--- DEMO EMAIL ---")
        print(f"To: {to_email}")
        print(f"Subject: {subject}")
        print(html)
        print("------------------")
        print()
        return True

    if not RESEND_API_KEY:
        print(
            "Email skipped: RESEND_API_KEY "
            "is not configured."
        )
        return False

    try:
        resend.api_key = RESEND_API_KEY

        response = resend.Emails.send(
            {
                "from": EMAIL_FROM,
                "to": [to_email],
                "subject": subject,
                "html": html,
            }
        )

        print(
            f"Email sent successfully to {to_email}: "
            f"{response}"
        )
        return True

    except Exception as exc:
        print(
            "Email send failed:",
            str(exc),
        )
        return False

'''

          text = text[:start] + replacement + text[end + 1:]
          compile(text, "app.py", "exec")
          app_path.write_text(text)

          req = req_path.read_text()
          if not any(line.strip().split("=")[0].strip() == "resend" for line in req.splitlines()):
              if not req.endswith("\n"):
                  req += "\n"
              req += "resend\n"
              req_path.write_text(req)
          PY

      - name: Validate patch
        run: |
          python -m py_compile app.py
          grep -n '^resend$' requirements.txt
          grep -n 'import resend' app.py
          grep -n 'resend.Emails.send' app.py
          if grep -n 'https://api.resend.com/emails' app.py; then
            echo "Raw Resend HTTP call still present"
            exit 1
          fi

      - name: Remove one-time workflow
        run: rm .github/workflows/patch-resend-sdk.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py requirements.txt .github/workflows/patch-resend-sdk.yml
          git diff --cached --check
          git commit -m "fix: use official Resend Python SDK"
          git push origin HEAD:fix/resend-sdk
