name: Instagram CRT Autopilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-organic.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: instagram-crt-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Prepare due feed posts
        id: prepare
        env:
          AUTOPILOT_TOKEN: ${{ secrets.HUNTER_OPERATOR_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 4 --retry-delay 15 --max-time 120 \
            -X POST https://app.tryemptychair.com/internal/instagram/autopilot/prepare \
            -H "Authorization: Bearer $AUTOPILOT_TOKEN" \
            -o autopilot-response.json
          cat autopilot-response.json
          echo "due=$(jq -r '.due // false' autopilot-response.json)" >> "$GITHUB_OUTPUT"
          echo "published=$(jq -r '.published // false' autopilot-response.json)" >> "$GITHUB_OUTPUT"

      - name: Install headless browser
        if: steps.prepare.outputs.due == 'true' && steps.prepare.outputs.published != 'true'
        run: |
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render and publish all due posts
        if: steps.prepare.outputs.due == 'true' && steps.prepare.outputs.published != 'true'
        env:
          AUTOPILOT_TOKEN: ${{ secrets.HUNTER_OPERATOR_INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from PIL import Image
          from playwright.sync_api import sync_playwright

          response = json.load(open('autopilot-response.json'))
          posts = response.get('posts') or [response]
          posts = [p for p in posts if p.get('id') and p.get('render_url')]
          if not posts:
              raise SystemExit('No publishable posts returned')

          token = os.environ['AUTOPILOT_TOKEN']
          with sync_playwright() as p:
              browser = p.chromium.launch()
              for index, post in enumerate(posts, start=1):
                  post_id = post['id']
                  page = browser.new_page(viewport={'width': 1080, 'height': 1080}, device_scale_factor=1)
                  png = Path(f'crt-post-{index}.png')
                  jpg = Path(f'crt-post-{index}.jpg')
                  page.goto(post['render_url'], wait_until='networkidle', timeout=120000)
                  page.screenshot(path=str(png), full_page=False)
                  page.close()
                  Image.open(png).convert('RGB').save(jpg, 'JPEG', quality=94, optimize=True)

                  subprocess.run([
                      'curl', '--fail-with-body', '--silent', '--show-error', '--max-time', '120',
                      '-X', 'POST', f'https://app.tryemptychair.com/internal/instagram/autopilot/image/{post_id}',
                      '-H', f'Authorization: Bearer {token}',
                      '-H', 'Content-Type: image/jpeg',
                      '--data-binary', f'@{jpg}',
                  ], check=True)

                  subprocess.run([
                      'curl', '--fail-with-body', '--silent', '--show-error', '--retry', '2', '--retry-delay', '10', '--max-time', '180',
                      '-X', 'POST', f'https://app.tryemptychair.com/internal/instagram/autopilot/publish/{post_id}',
                      '-H', f'Authorization: Bearer {token}',
                  ], check=True)
                  print(f'Published {index}/{len(posts)} // {post_id}', flush=True)
              browser.close()
          PY
