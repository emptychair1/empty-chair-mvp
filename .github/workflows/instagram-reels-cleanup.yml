name: Instagram Reels Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-reels-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete obsolete Reel rows and MP4s
        env:
          AUTOPILOT_TOKEN: ${{ secrets.HUNTER_OPERATOR_INGEST_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            HTTP_CODE=$(curl --silent --show-error --max-time 20 \
              -X POST https://app.tryemptychair.com/internal/instagram/reels/cleanup-obsolete-fast \
              -H "Authorization: Bearer $AUTOPILOT_TOKEN" \
              -o cleanup.json \
              -w '%{http_code}' || true)
            echo "HTTP $HTTP_CODE // attempt $attempt"
            cat cleanup.json || true
            if [ "$HTTP_CODE" = "200" ] && [ "$(jq -r '.ok // false' cleanup.json)" = "true" ]; then
              REMAINING=$(jq -r '.remaining // 0' cleanup.json)
              if [ "$REMAINING" = "0" ]; then
                echo "obsolete Reels removed"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "fast cleanup did not finish"
          exit 1
