name: Hunter Sprint 1

on:
  push:
    paths:
      - 'hunter/**'
      - '.github/workflows/hunter-sprint1.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hunter/requirements.txt

      - name: Install Hunter dependencies
        run: pip install -r hunter/requirements.txt

      - name: Run Hunter contract tests
        working-directory: hunter
        run: pytest -q

      - name: Collect public cancellation signals
        run: python hunter/collect.py --out hunter-signals.json

      - name: Upload Hunter signals
        uses: actions/upload-artifact@v4
        with:
          name: hunter-signals-${{ github.run_id }}
          path: hunter-signals.json
          if-no-files-found: error
          retention-days: 14
