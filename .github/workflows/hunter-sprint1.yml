name: Hunter Discovery + Resolution + Intent + Queue + Actions + Attribution + Learning + Validation + Operator

on:
  push:
    paths:
      - 'hunter/**'
      - 'v2_hunter_operator.py'
      - 'bootstrap.py'
      - '.github/workflows/hunter-sprint1.yml'
  pull_request:
    paths:
      - 'hunter/**'
      - 'v2_hunter_operator.py'
      - 'bootstrap.py'
      - '.github/workflows/hunter-sprint1.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hunter/requirements.txt

      - name: Install Hunter dependencies
        run: pip install -r hunter/requirements.txt

      - name: Run Hunter contract tests
        working-directory: hunter
        run: pytest -q

      - name: Compile operator production extension
        run: python -m py_compile hunter/operator_console.py v2_hunter_operator.py bootstrap.py hunter/integrate_instagram.py hunter/instagram_hashtag_source.py

      - name: Collect public cancellation signals
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python hunter/collect.py --out hunter-signals.json

      - name: Check Meta Instagram configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: meta_config
        env:
          HUNTER_META_ACCESS_TOKEN: ${{ secrets.HUNTER_META_ACCESS_TOKEN }}
          HUNTER_META_IG_USER_ID: ${{ vars.HUNTER_META_IG_USER_ID }}
        run: |
          if [ -n "$HUNTER_META_ACCESS_TOKEN" ] && [ -n "$HUNTER_META_IG_USER_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Meta Instagram discovery is not configured; continuing with public-web signals only.'
          fi

      - name: Install Chromium and Tesseract for Instagram resolver
        if: steps.meta_config.outputs.configured == 'true'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Discover and visually resolve fresh Instagram signals
        if: steps.meta_config.outputs.configured == 'true'
        env:
          HUNTER_META_ACCESS_TOKEN: ${{ secrets.HUNTER_META_ACCESS_TOKEN }}
          HUNTER_META_IG_USER_ID: ${{ vars.HUNTER_META_IG_USER_ID }}
          HUNTER_META_GRAPH_VERSION: v26.0
        run: python hunter/instagram_hashtag_source.py --out hunter-instagram-signals.json --limit 50 --max-resolutions 40

      - name: Resolve public-web tattoo artist accounts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python hunter/resolve.py --input hunter-signals.json --out hunter-artists.json

      - name: Merge Meta Instagram discoveries into Hunter
        if: steps.meta_config.outputs.configured == 'true'
        run: |
          python hunter/integrate_instagram.py \
            --signals hunter-signals.json \
            --artists hunter-artists.json \
            --instagram hunter-instagram-signals.json \
            --signals-out hunter-signals-merged.json \
            --artists-out hunter-artists-merged.json
          mv hunter-signals-merged.json hunter-signals.json
          mv hunter-artists-merged.json hunter-artists.json

      - name: Score cancellation intent
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python hunter/score.py --signals hunter-signals.json --artists hunter-artists.json --out hunter-scores.json

      - name: Restore Hunter queue history
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: .hunter-state/hunter-queue.json
          key: hunter-queue-${{ github.run_id }}
          restore-keys: |
            hunter-queue-

      - name: Build target queue
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python hunter/target_queue.py \
            --scores hunter-scores.json \
            --history .hunter-state/hunter-queue.json \
            --out hunter-queue.json

      - name: Run action engine
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HUNTER_ACTION_ENABLED: ${{ vars.HUNTER_ACTION_ENABLED }}
          HUNTER_ACTION_WEBHOOK_URL: ${{ secrets.HUNTER_ACTION_WEBHOOK_URL }}
          HUNTER_ACTION_WEBHOOK_TOKEN: ${{ secrets.HUNTER_ACTION_WEBHOOK_TOKEN }}
        run: |
          MODE=preview
          if [ "$HUNTER_ACTION_ENABLED" = "true" ] && [ -n "$HUNTER_ACTION_WEBHOOK_URL" ]; then
            MODE=execute
          fi
          python hunter/action_engine.py \
            --queue hunter-queue.json \
            --out hunter-actions.json \
            --queue-out hunter-queue-after-actions.json \
            --journal hunter-action-journal.jsonl \
            --mode "$MODE"
          mkdir -p .hunter-state
          cp hunter-queue-after-actions.json .hunter-state/hunter-queue.json

      - name: Restore Hunter attribution events
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v4
        with:
          path: .hunter-state/hunter-attribution-events.json
          key: hunter-attribution-events-${{ github.run_id }}
          restore-keys: |
            hunter-attribution-events-

      - name: Build attribution manifest and report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          EVENTS_ARG=""
          if [ -f .hunter-state/hunter-attribution-events.json ]; then
            EVENTS_ARG="--events .hunter-state/hunter-attribution-events.json"
          fi
          python hunter/attribution.py \
            --queue hunter-queue-after-actions.json \
            --base-url https://app.tryemptychair.com \
            $EVENTS_ARG \
            --manifest-out hunter-attribution.json \
            --report-out hunter-attribution-report.json

      - name: Build learning report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python hunter/learning.py \
            --attribution hunter-attribution-report.json \
            --signals hunter-signals.json \
            --out hunter-learning-report.json

      - name: Save Hunter queue history
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .hunter-state/hunter-queue.json
          key: hunter-queue-${{ github.run_id }}

      - name: Validate Hunter run artifacts
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python hunter/validate_run.py \
            --out hunter-validation.json \
            --summary-out hunter-validation-summary.md \
            --strict

      - name: Build operator snapshot
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python hunter/operator_console.py \
            --queue hunter-queue-after-actions.json \
            --attribution hunter-attribution-report.json \
            --validation hunter-validation.json \
            --learning hunter-learning-report.json \
            --signals hunter-signals.json \
            --out hunter-operator-snapshot.json

      - name: Sync operator console
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          HUNTER_OPERATOR_INGEST_URL: ${{ secrets.HUNTER_OPERATOR_INGEST_URL }}
          HUNTER_OPERATOR_INGEST_TOKEN: ${{ secrets.HUNTER_OPERATOR_INGEST_TOKEN }}
        run: |
          if [ -z "$HUNTER_OPERATOR_INGEST_URL" ] || [ -z "$HUNTER_OPERATOR_INGEST_TOKEN" ]; then
            echo "Hunter operator sync not configured; snapshot remains an artifact."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            -X POST "$HUNTER_OPERATOR_INGEST_URL" \
            -H "Authorization: Bearer $HUNTER_OPERATOR_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @hunter-operator-snapshot.json

      - name: Publish Hunter discovery metrics
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -f hunter-instagram-signals.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open('hunter-instagram-signals.json'))
          m = p.get('metrics', {})
          print('## Hunter Instagram discovery')
          print(f"- tags: {p.get('tag_count', len(p.get('tags', [])))}")
          print(f"- media scanned: {m.get('media_scanned', 0)}")
          print(f"- fresh media: {m.get('fresh_media', 0)}")
          print(f"- unique intent candidates: {m.get('unique_candidate_posts', p.get('signal_count', 0))}")
          print(f"- resolved artists: {m.get('resolved_count', p.get('resolved_count', 0))}")
          print(f"- duplicate hits removed: {m.get('duplicate_hits', 0)}")
          PY
          fi

      - name: Publish Hunter validation summary
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -f hunter-validation-summary.md ]; then
            cat hunter-validation-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Hunter validation' >> "$GITHUB_STEP_SUMMARY"
            echo 'Validation summary was not produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Hunter artifacts
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hunter-signals-${{ github.run_id }}
          path: |
            hunter-signals.json
            hunter-instagram-signals.json
            hunter-artists.json
            hunter-scores.json
            hunter-queue.json
            hunter-actions.json
            hunter-queue-after-actions.json
            hunter-action-journal.jsonl
            hunter-attribution.json
            hunter-attribution-report.json
            hunter-learning-report.json
            hunter-validation.json
            hunter-validation-summary.md
            hunter-operator-snapshot.json
          if-no-files-found: warn
          retention-days: 14
