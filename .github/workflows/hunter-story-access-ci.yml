name: Hunter Story Access Live Test

on:
  push:
    branches:
      - hunter-story-access-v2

permissions:
  contents: read

jobs:
  test-story-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hunter/requirements.txt
      - name: Install Hunter dependencies
        run: pip install -r hunter/requirements.txt
      - name: Run Story unit tests
        working-directory: hunter
        run: pytest -q test_story_access_probe.py
      - name: Probe official Meta Story access
        env:
          HUNTER_META_ACCESS_TOKEN: ${{ secrets.HUNTER_META_ACCESS_TOKEN }}
          HUNTER_META_IG_USER_ID: ${{ vars.HUNTER_META_IG_USER_ID }}
          HUNTER_META_GRAPH_VERSION: v26.0
        run: python hunter/story_access_probe.py --out hunter-story-access.json --target-username dino_tattoos
      - name: Upload Story result
        uses: actions/upload-artifact@v4
        with:
          name: hunter-story-access-live-${{ github.run_id }}
          path: hunter-story-access.json
          if-no-files-found: error
          retention-days: 1
