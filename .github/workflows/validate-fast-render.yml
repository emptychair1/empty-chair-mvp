name: Validate fast Render deploy

on:
  push:
    branches:
      - chore/render-fast-deploys-final-2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Validate production install
        run: uv sync --frozen --no-dev --no-install-project
      - name: Validate app imports and Render YAML
        run: |
          .venv/bin/python -m py_compile app.py bootstrap.py features.py notifications.py pwa.py
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('render.yaml').read_text())
          service = data['services'][0]
          assert service['buildCommand'] == 'uv sync --frozen --no-dev --no-install-project'
          assert service['startCommand'].startswith('.venv/bin/uvicorn bootstrap:app')
          assert 'buildFilter' in service
          print('fast Render deploy validation ok')
          PY
