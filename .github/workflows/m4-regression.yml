name: m4-regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "m4_*.py"
      - "tests/test_m4_*.py"
      - "tests/fixtures/m4_*.json"
      - ".github/workflows/m4-regression.yml"

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run M4 deterministic architecture regression
        env:
          EMPTY_CHAIR_DB: test_empty_chair.db
          EMPTY_CHAIR_DEMO_MODE: "true"
          EMPTY_CHAIR_SESSION_SECRET: test-secret
        run: pytest -q tests/test_m4_synthetic_harness.py tests/test_m4_historical_regressions.py tests/test_m4_transport_patch.py tests/test_m4_behavior_state.py tests/test_m4_latency_presence.py

  model-in-loop-regression:
    runs-on: ubuntu-latest
    needs: deterministic-regression
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      M4_SYNTHETIC_MODEL: gemini-2.5-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run adversarial synthetic prospect against M4
        if: ${{ env.GEMINI_API_KEY != '' }}
        env:
          EMPTY_CHAIR_DB: test_empty_chair.db
          EMPTY_CHAIR_DEMO_MODE: "true"
          EMPTY_CHAIR_SESSION_SECRET: test-secret
        run: python m4_synthetic_live.py > m4-synthetic-result.json
      - name: Upload synthetic meeting result
        if: ${{ always() && env.GEMINI_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: m4-synthetic-result
          path: m4-synthetic-result.json
