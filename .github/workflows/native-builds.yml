name: Native Containers

on:
  pull_request:
    paths:
      - "ios/**"
      - "android/**"
      - "v2_native_*.py"
      - "bootstrap.py"
      - ".github/workflows/native-builds.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "android/**"
      - "v2_native_*.py"
      - "bootstrap.py"
      - ".github/workflows/native-builds.yml"

jobs:
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build iOS simulator app
        run: xcodebuild -project ios/EmptyChair.xcodeproj -scheme EmptyChair -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build Android debug app
        run: gradle -p android :app:assembleDebug
