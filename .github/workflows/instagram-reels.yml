name: Instagram Reels Autopilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/instagram-reels.yml'
  workflow_dispatch:
    inputs:
      test_now:
        description: 'Generate a Reel immediately without publishing'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: instagram-reels-autopilot
  cancel-in-progress: false

# This is intentionally separate from instagram-organic.yml. Reel failures cannot
# cancel, block, or mutate the proven CRT feed-post job.
# Test trigger: canonical 10-scene recovery story.
jobs:
  reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ask Empty Chair for scheduled or immediate test Reel
        id: prepare
        env:
          AUTOPILOT_TOKEN: ${{ secrets.HUNTER_OPERATOR_INGEST_TOKEN }}
          TEST_NOW: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_now) }}
        run: |
          set -euo pipefail
          ENDPOINT="https://app.tryemptychair.com/internal/instagram/reels/prepare"
          if [ "$TEST_NOW" = "true" ]; then
            ENDPOINT="https://app.tryemptychair.com/internal/instagram/reels/prepare-test"
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --max-time 120 \
            -X POST "$ENDPOINT" \
            -H "Authorization: Bearer $AUTOPILOT_TOKEN" \
            -o reel.json
          cat reel.json
          echo "due=$(jq -r '.due // false' reel.json)" >> "$GITHUB_OUTPUT"
          echo "published=$(jq -r '.published // false' reel.json)" >> "$GITHUB_OUTPUT"
          echo "video_url=$(jq -r '.video_url // empty' reel.json)" >> "$GITHUB_OUTPUT"

      - name: Install renderer
        if: steps.prepare.outputs.due == 'true' && steps.prepare.outputs.published != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet playwright pillow
          python -m playwright install --with-deps chromium

      - name: Render 9:16 scenes and compose MP4
        if: steps.prepare.outputs.due == 'true' && steps.prepare.outputs.published != 'true'
        env:
          AUTOPILOT_TOKEN: ${{ secrets.HUNTER_OPERATOR_INGEST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from playwright.sync_api import sync_playwright

          data=json.load(open('reel.json'))
          urls=data['scene_urls']
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for i,url in enumerate(urls):
                  page=browser.new_page(viewport={'width':1080,'height':1920}, device_scale_factor=1)
                  page.goto(url, wait_until='networkidle', timeout=120000)
                  page.screenshot(path=f'scene-{i}.png', full_page=False)
                  page.close()
              browser.close()

          inputs=[]
          filters=[]
          for i in range(len(urls)):
              inputs += ['-loop','1','-t','3','-i',f'scene-{i}.png']
              filters.append(f'[{i}:v]fps=30,format=yuv420p[v{i}]')
          concat=''.join(f'[v{i}]' for i in range(len(urls)))+f'concat=n={len(urls)}:v=1:a=0[outv]'
          subprocess.run(['ffmpeg','-y',*inputs,'-filter_complex',';'.join(filters+[concat]),'-map','[outv]','-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart','reel.mp4'],check=True)

          token=os.environ['AUTOPILOT_TOKEN']
          subprocess.run(['curl','--fail-with-body','--silent','--show-error','--max-time','180','-X','POST',data['upload_url'],'-H',f'Authorization: Bearer {token}','-H','Content-Type: video/mp4','--data-binary','@reel.mp4'],check=True)
          print('VIDEO_URL='+data['video_url'])
          PY

      - name: Publish is intentionally gated
        if: steps.prepare.outputs.due == 'true' && steps.prepare.outputs.published != 'true'
        run: |
          echo "Reel rendered and stored. Meta publishing is disabled for this test lane."
          echo "Preview: ${{ steps.prepare.outputs.video_url }}"
