name: Hunter Pain-Fit Artist Bucket

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hunter-pain-fit-bucket
  cancel-in-progress: false

jobs:
  bucket:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hunter/requirements.txt

      - name: Install Hunter dependencies
        run: pip install -r hunter/requirements.txt

      - name: Test pain-fit bucket
        working-directory: hunter
        run: pytest -q test_pain_fit_bucket.py

      - name: Check Meta configuration
        id: meta
        env:
          HUNTER_META_ACCESS_TOKEN: ${{ secrets.HUNTER_META_ACCESS_TOKEN }}
          HUNTER_META_IG_USER_ID: ${{ vars.HUNTER_META_IG_USER_ID }}
        run: |
          if [ -n "$HUNTER_META_ACCESS_TOKEN" ] && [ -n "$HUNTER_META_IG_USER_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser resolver dependencies
        if: steps.meta.outputs.configured == 'true'
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Build pain-fit artist bucket
        if: steps.meta.outputs.configured == 'true'
        env:
          HUNTER_META_ACCESS_TOKEN: ${{ secrets.HUNTER_META_ACCESS_TOKEN }}
          HUNTER_META_IG_USER_ID: ${{ vars.HUNTER_META_IG_USER_ID }}
          HUNTER_META_GRAPH_VERSION: v26.0
        run: |
          python hunter/pain_fit_bucket.py \
            --out hunter-pain-fit-bucket.json \
            --per-tag-limit 50 \
            --max-seed-resolutions 60 \
            --media-per-artist 25 \
            --min-pain-fit 50

      - name: Publish bucket metrics
        if: always() && steps.meta.outputs.configured == 'true'
        run: |
          if [ -f hunter-pain-fit-bucket.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          p = json.load(open('hunter-pain-fit-bucket.json'))
          m = p['metrics']
          print('## Hunter pain-fit artist bucket')
          print(f"- raw posts scanned: {m['raw_posts_scanned']}")
          print(f"- unique fresh posts: {m['unique_fresh_posts']}")
          print(f"- unique artist seeds: {m['unique_artist_seeds']}")
          print(f"- recent artist media scanned: {m['artist_recent_media_scanned']}")
          print(f"- pain-fit artists >=50: {m['pain_fit_artists']}")
          PY
          fi

      - name: Upload bucket
        if: always() && steps.meta.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hunter-pain-fit-bucket-${{ github.run_id }}
          path: hunter-pain-fit-bucket.json
          if-no-files-found: warn
          retention-days: 14
