name: Validate customer claim flow

on:
  push:
    branches:
      - feature/customer-claim-flow-v3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install production dependencies
        run: uv sync --frozen --no-dev --no-install-project
      - name: Validate claim flow
        env:
          EMPTY_CHAIR_DEMO_MODE: 'true'
          EMPTY_CHAIR_EMAIL_LIVE: 'false'
          EMPTY_CHAIR_SMS_LIVE: 'false'
        run: |
          .venv/bin/python -m py_compile app.py bootstrap.py features.py notifications.py claim_flow.py
          .venv/bin/python - <<'PY'
          import bootstrap
          claim_routes = [
              route for route in bootstrap.app.router.routes
              if getattr(route, 'path', None) == '/offer/{offer_id}/claim'
              and 'POST' in (getattr(route, 'methods', set()) or set())
          ]
          assert len(claim_routes) == 1, len(claim_routes)
          assert claim_routes[0].endpoint.__name__ == 'claim_offer_atomic'
          print('atomic claim route validation ok')
          PY
