services:
  - type: web
    name: empty-chair
    runtime: python
    branch: main
    buildCommand: uv sync --frozen --no-dev --no-install-project
    startCommand: .venv/bin/uvicorn production_entry:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    buildFilter:
      ignoredPaths:
        - README.md
        - LOCAL_TESTING.md
        - ".github/**"
        - "tests/**"
        - requirements-dev.txt
