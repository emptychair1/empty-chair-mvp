services:
  - type: web
    name: empty-chair
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: worker
    name: empty-chair-autopilot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python autopilot_worker.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: EMPTY_CHAIR_BASE_URL
        sync: false
      - key: EMPTY_CHAIR_DEMO_MODE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: EMPTY_CHAIR_AUTOPILOT_POLL_SECONDS
        value: 30
