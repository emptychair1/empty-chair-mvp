services:
  - type: web
    name: empty-chair
    runtime: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn production_entry:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    buildFilter:
      ignoredPaths:
        - README.md
        - LOCAL_TESTING.md
        - ".github/**"
        - "tests/**"
        - requirements-dev.txt
