<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title }} · Empty Chair</title><link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}"><style>.form-card{max-width:800px;padding:24px;border:1px solid var(--line);background:#0d0f0d}.form-card h2{margin:6px 0 8px;font-size:32px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:12px;line-height:1.55}.eyebrow{color:var(--signal);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.consent{display:flex;align-items:flex-start;gap:10px;padding:14px;border:1px solid var(--line);background:#090b09}.consent input{width:auto;margin-top:3px}.actions{display:flex;gap:10px;margin-top:18px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="app-shell">{% set active_page='customers' %}{% include '_sidebar.html' %}<main class="main"><header class="topbar"><div><div class="page-title">{{ page_title }}</div><div class="page-subtitle">Only record what is useful, known, and permitted.</div></div></header><div class="content"><section class="form-card"><div class="eyebrow">PERCEPTION</div><h2>{{ page_title }}</h2><p class="sub">Preferences are observations, not permanent truths. Consent controls whether Empty Chair may communicate; it never gets inferred.</p><form method="post" action="{{ form_action }}"><div class="form-grid"><label>Name<input name="name" required maxlength="160" value="{{ customer.name if customer else '' }}" placeholder="Customer name"></label><label>Phone<input name="phone" value="{{ customer.phone if customer else '' }}" placeholder="+1 555 555 5555"></label><label class="full">Email<input name="email" type="email" value="{{ customer.email if customer and customer.email else '' }}" placeholder="customer@example.com"></label><label>Artist preference<input name="preferred_artists" value="{{ customer.preferred_artists if customer else '' }}" placeholder="Averie, Jordan"></label><label>Style preference<input name="preferred_styles" value="{{ customer.preferred_styles if customer else '' }}" placeholder="Traditional, blackwork"></label><label class="full">Service preference<input name="preferred_services" value="{{ customer.preferred_services if customer else 'tattoo' }}" placeholder="tattoo"></label><label class="consent full"><input name="communication_consent" type="checkbox" {% if customer and customer.communication_consent %}checked{% endif %}><span><strong>Customer explicitly permits communication</strong><br><span class="sub">Required before Empty Chair may send an opening.</span></span></label></div><div class="actions"><button class="button" type="submit">Save what we know</button><a class="button secondary" href="/customers">Cancel</a></div></form></section></div></main></div></body></html>
