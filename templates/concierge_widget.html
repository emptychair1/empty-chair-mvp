<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concierge</title>
<style>
:root{--bg:#080908;--panel:#0d100d;--panel2:#121612;--cream:#f0eadf;--muted:#929a90;--line:#2b3029;--lime:#d8ff45;--soft:#171c17}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:transparent;color:var(--cream)}.widget{height:100vh;min-height:520px;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.28)}.head{display:flex;align-items:center;gap:11px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid #3a4237;background:#0a0c0a}.mark svg{width:25px;height:14px}.headcopy{min-width:0}.head strong{display:block;font-size:14px;letter-spacing:.01em}.head small{display:block;color:var(--muted);font:600 9px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}.dot{width:6px;height:6px;border-radius:50%;background:var(--lime);display:inline-block;margin-right:5px;box-shadow:0 0 0 3px rgba(216,255,69,.08)}.thread{flex:1;overflow:auto;padding:16px;background:linear-gradient(180deg,#090b09,#0b0e0b)}.message{max-width:86%;padding:10px 12px;border-radius:14px;margin:0 0 10px;line-height:1.42;font-size:14px;white-space:pre-wrap}.message.concierge{background:var(--panel2);border:1px solid #30362e;border-bottom-left-radius:5px;color:var(--cream)}.message.user{background:var(--lime);color:#0a0d08;margin-left:auto;border-bottom-right-radius:5px;font-weight:600}.message small{display:block;font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;opacity:.52;margin-top:6px}.typing{display:flex;gap:3px;padding:3px 0}.typing i{width:5px;height:5px;background:#899184;border-radius:50%;display:block}.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0;background:var(--panel)}.quick button{border:1px solid #394036;background:#101410;color:#d8d8d0;border-radius:999px;padding:7px 10px;font-size:11px;cursor:pointer}.quick button:hover{border-color:#66705f}.composer{background:var(--panel);border-top:1px solid var(--line);padding-bottom:10px}.imagebar{display:flex;align-items:center;gap:8px;padding:10px 12px 0}.upload-label{display:inline-flex;align-items:center;gap:7px;border:1px solid #394036;background:#101410;color:#c7cec3;border-radius:10px;padding:8px 10px;font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.03em;cursor:pointer}.upload-label:hover{border-color:#697461}.upload-label svg{width:14px;height:14px;stroke:var(--lime)}.upload-label input{display:none}.image-status{min-width:0;flex:1;color:#7f887d;font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.image-status.learned{color:var(--lime)}.inputrow{display:flex;gap:8px;padding:9px 12px 0}.inputrow input{flex:1;min-width:0;border:1px solid #394036;border-radius:12px;padding:11px 12px;font-size:14px;outline:none;background:#090b09;color:var(--cream)}.inputrow input::placeholder{color:#6f776d}.inputrow input:focus{border-color:#697461}.send{border:0;border-radius:12px;background:var(--lime);color:#0a0d08;padding:0 15px;font-weight:900;cursor:pointer}.send:disabled{opacity:.45;cursor:default}.foot{text-align:center;color:#697167;font:600 8px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;padding:7px 12px 0}.foot b{color:#8b9587}.hidden{display:none!important}
</style>
</head>
<body>
<div class="widget">
  <div class="head">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 40 18" fill="none"><path d="M1 9h15" stroke="#f0eadf" stroke-width="3"/><circle cx="19" cy="9" r="3" fill="#d8ff45"/><path d="M22 9h17" stroke="#f0eadf" stroke-width="3"/></svg></div>
    <div class="headcopy"><strong>Concierge</strong><small><span class="dot"></span>Here to help with your tattoo</small></div>
  </div>
  <div id="thread" class="thread"><div class="message concierge">Hey — what are you thinking about getting?<small>Concierge</small></div></div>
  <div class="composer">
    <div id="quick" class="quick"></div>
    <div class="imagebar">
      <label class="upload-label" for="inspirationInput"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 5v14M5 12h14"/><path d="M4 4h16v16H4z"/></svg><span>Add inspiration</span><input id="inspirationInput" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
      <span id="imageStatus" class="image-status">Optional · up to 6 images</span>
    </div>
    <div class="inputrow"><input id="answer" autocomplete="off" placeholder="Type a message…"><button id="send" class="send">Send</button></div>
    <div class="foot">Powered by <b>Empty Chair</b> · Your answers go directly to this shop</div>
  </div>
</div>
<script>window.EMPTY_CHAIR_CONCIERGE={shopId:{{ shop_id|tojson }},widget:true};</script>
<script src="/static/concierge-widget.js"></script>
</body>
</html>
