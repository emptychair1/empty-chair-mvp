<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account · Empty Chair</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='/favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/auth.css') }}">
</head>
<body class="auth-page">
  <div class="auth-embers" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main class="auth-shell">
    <div class="auth-brand">
      <img src="{{ url_for('static', path='/empty-chair-logo.png') }}" alt="Empty Chair">
    </div>
    <section class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Set up your studio and start recovering cancellations.</p>
      {% if error %}<div class="auth-message">{{ error }}</div>{% endif %}
      <form class="auth-form" method="post" action="/signup">
        <div class="auth-field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="auth-field">
          <label for="shop_name">Shop name</label>
          <input id="shop_name" name="shop_name" type="text" autocomplete="organization" required>
        </div>
        <div class="auth-field full">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field full">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="auth-submit" type="submit">Create account</button>
      </form>
      <div class="auth-links">
        Already have an account? <a href="/login">Log in</a>
      </div>
    </section>
  </main>
</body>
</html>
