<!doctype html>
<html lang="en">
<head>
    <link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', path='/favicon.png') }}"
>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account · Empty Chair</title>

<style>
:root {
    --bg: #0e0f11;
    --panel: #17191d;
    --panel-2: #1f2227;
    --text: #f4f4f2;
    --muted: #a9adb5;
    --line: #2c3037;
    --accent: #f0c36a;
    --danger: #ff8c8c;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
        radial-gradient(circle at top, #22252b 0, var(--bg) 42%);
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
}
.auth-shell {
    width: 100%;
    max-width: 430px;
}
.brand {
    text-align: center;
    margin-bottom: 22px;
}
.brand img {
    max-width: 210px;
    max-height: 90px;
    object-fit: contain;
}
.brand h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: -0.04em;
}
.card {
    background: rgba(23,25,29,.96);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 24px 70px rgba(0,0,0,.35);
}
h2 {
    margin: 0 0 8px;
    font-size: 25px;
}
.sub {
    color: var(--muted);
    margin: 0 0 24px;
    line-height: 1.5;
}
label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin: 15px 0 7px;
}
input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 13px 14px;
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    outline: none;
}
input:focus {
    border-color: var(--accent);
}
button {
    width: 100%;
    margin-top: 20px;
    border: 0;
    border-radius: 11px;
    padding: 13px 16px;
    background: var(--accent);
    color: #17130a;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}
.links {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}
a { color: var(--text); }
.error {
    background: rgba(255, 80, 80, .10);
    border: 1px solid rgba(255, 120, 120, .35);
    color: var(--danger);
    padding: 11px 12px;
    border-radius: 10px;
    margin: 14px 0;
    font-size: 14px;
}
.success {
    background: rgba(90, 220, 140, .10);
    border: 1px solid rgba(90, 220, 140, .35);
    padding: 11px 12px;
    border-radius: 10px;
    margin: 14px 0;
    font-size: 14px;
}
</style>

</head>
<body>
<div class="auth-shell">
    <div class="brand">
        <img src="{{ url_for('static', path='/empty-chair-logo.png') }}"
             alt="Empty Chair">
    </div>
    <div class="card">

        <h2>Create your account</h2>
        <p class="sub">Set up your shop and start recovering cancellations.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/signup">
            <label for="name">Your name</label>
            <input id="name" name="name" type="text"
                   autocomplete="name" required>

            <label for="shop_name">Shop name</label>
            <input id="shop_name" name="shop_name" type="text"
                   autocomplete="organization" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="8" required>

            <button type="submit">Create account</button>
        </form>

        <div class="links">
            Already have an account? <a href="/login">Log in</a>
        </div>

    </div>
</div>
</body>
</html>
