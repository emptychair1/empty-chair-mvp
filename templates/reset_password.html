<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · Empty Chair</title><link rel="icon" type="image/png" href="{{ url_for('static', path='/favicon.png') }}"><link rel="stylesheet" href="{{ url_for('static', path='/auth.css') }}"></head><body class="auth-page"><main class="auth-shell"><div class="auth-brand"><div class="auth-mark"><svg viewBox="0 0 120 60" aria-hidden="true"><path d="M2 30H50" stroke="#f0eadf" stroke-width="5"/><circle cx="53" cy="30" r="5" fill="#d8ff45"/><path d="M58 30H116" stroke="#f0eadf" stroke-width="5"/><path d="M56 33L110 55" stroke="#70756b" stroke-width="3" stroke-dasharray="6 6"/><circle cx="114" cy="56" r="4" fill="none" stroke="#70756b" stroke-width="2"/></svg><span class="auth-wordmark"><strong>EMPTY CHAIR</strong><span>Know what is. Change what happens next.</span></span></div></div><section class="auth-card"><div class="auth-kicker">Secure access</div><h1>Set a new key.</h1>{% if not valid %}<div class="auth-message">This reset link is no longer valid.</div><div class="auth-links"><a href="/forgot-password">Request another reset link</a></div>{% else %}<p class="auth-sub">Choose a new password. Nothing else about the account changes.</p>{% if error %}<div class="auth-message">{{ error }}</div>{% endif %}<form class="auth-form" method="post" action="/reset-password"><input type="hidden" name="token" value="{{ token }}"><div class="auth-field full"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="auth-field full"><label for="password_confirm">Confirm password</label><input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="auth-submit" type="submit">Change password</button></form>{% endif %}</section></main></body></html>
