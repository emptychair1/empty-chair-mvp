<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experience observed · Empty Chair</title><link rel="icon" type="image/png" href="{{ url_for('static', path='/favicon.png') }}"><link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}"><style>.result-shell{max-width:780px;margin:auto;padding:70px 24px}.result-card{padding:28px;border:1px solid var(--line);background:linear-gradient(145deg,#111410,#090b09)}.eyebrow{color:var(--signal);font:600 9px 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase}.result-card h1{margin:10px 0 22px;font-size:clamp(38px,5vw,54px);letter-spacing:-.05em}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.result{padding:18px;background:#090b09}.result span{color:var(--muted);font:500 9px 'IBM Plex Mono',monospace;text-transform:uppercase}.result strong{display:block;margin-top:7px;font-size:30px}.notes{margin-top:18px;padding:16px;border-left:2px solid var(--line);background:#0d0f0d;color:var(--cream-dim);font-size:12px;line-height:1.6}@media(max-width:560px){.result-grid{grid-template-columns:1fr}}</style></head><body><main class="result-shell"><section class="result-card"><div class="eyebrow">OUTCOME</div><h1>The world got a little more observable.</h1><div class="result-grid"><div class="result"><span>NEW</span><strong>{{ imported }}</strong></div><div class="result"><span>LEARNED MORE</span><strong>{{ updated }}</strong></div><div class="result"><span>NOT USED</span><strong>{{ skipped }}</strong></div></div>{% if errors %}<div class="notes"><strong>What could not be understood</strong><ul>{% for error in errors %}<li>{{ error }}</li>{% endfor %}</ul></div>{% endif %}<p style="margin:20px 0 0"><a class="button" href="{{ return_url|default('/') }}">{{ return_label|default('Continue') }}</a></p></section></main></body></html>
