<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Empty Chair</title>

<style>
:root {
    --bg: #0e0f11;
    --panel: #17191d;
    --panel-2: #1f2227;
    --text: #f4f4f2;
    --muted: #a9adb5;
    --line: #2c3037;
    --accent: #f0c36a;
    --danger: #ff8c8c;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
        linear-gradient(
            rgba(5, 5, 5, 0.35),
            rgba(5, 5, 5, 0.55)
        ),
        url("/static/ChatGPT%20Image%20Aug%2012%2C%202026%2C%2004_44_30%20AM.png")
        center center / cover no-repeat fixed;
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
}
.auth-shell {
    width: 100%;
    max-width: 430px;
}
.brand {
    text-align: center;
    margin-bottom: 22px;
}
.brand img {
    max-width: 210px;
    max-height: 90px;
    object-fit: contain;
}
.brand h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: -0.04em;
}
.card {
    width: min(420px, 100%);
    padding: 34px 36px 36px;
    border: 1px solid #8a6a32;
    border-radius: 12px;

    background:
        linear-gradient(
            145deg,
            rgba(20, 20, 20, 0.97),
            rgba(7, 7, 7, 0.97)
        );

    box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.75),
        0 0 0 1px rgba(198, 40, 40, 0.15);

    backdrop-filter: blur(8px);
}

.login-brand {
    display: flex;
    justify-content: center;
    margin-bottom: 26px;
}

.login-logo {
    display: block;
    width: 100%;
    max-width: 300px;
    height: auto;
}

label {
    color: #d7bd82;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

input {
    width: 100%;
    box-sizing: border-box;
    margin-top: 7px;
    padding: 13px 14px;

    border: 1px solid #49391f;
    border-radius: 6px;

    background: #0d0d0d;
    color: #f4ead6;

    font: inherit;
}

input:focus {
    outline: none;
    border-color: #c62828;
    box-shadow: 0 0 0 2px rgba(198, 40, 40, 0.18);
}

button {
    width: 100%;
    min-height: 48px;
    margin-top: 8px;

    border: 1px solid #ef3c32;
    border-radius: 6px;

    background: linear-gradient(
        180deg,
        #d32525,
        #941010
    );

    color: #fff;

    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;

    cursor: pointer;
}

button:hover {
    filter: brightness(1.1);
}
h2 {
    margin: 0 0 8px;
    font-size: 25px;
}
.sub {
    color: var(--muted);
    margin: 0 0 24px;
    line-height: 1.5;
}
label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin: 15px 0 7px;
}
input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 13px 14px;
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
    outline: none;
}
input:focus {
    border-color: var(--accent);
}
button {
    width: 100%;
    margin-top: 20px;
    border: 0;
    border-radius: 11px;
    padding: 13px 16px;
    background: var(--accent);
    color: #17130a;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}
.links {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
}
a { color: var(--text); }
.error {
    background: rgba(255, 80, 80, .10);
    border: 1px solid rgba(255, 120, 120, .35);
    color: var(--danger);
    padding: 11px 12px;
    border-radius: 10px;
    margin: 14px 0;
    font-size: 14px;
}
.success {
    background: rgba(90, 220, 140, .10);
    border: 1px solid rgba(90, 220, 140, .35);
    padding: 11px 12px;
    border-radius: 10px;
    margin: 14px 0;
    font-size: 14px;
}
</style>

</head>
<body>
<div class="auth-shell">
    <div class="card">

        <div class="brand">
            <img src="{{ url_for('static', path='/empty-chair-logo.png') }}"
                 alt="Empty Chair">
        </div>

        <h2>Welcome back</h2>
        <p class="sub">Sign in to manage openings and recover empty chairs.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next or '/' }}">

            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>

        <div class="links">
            <a href="/forgot-password">Forgot password?</a><br>
            New to Empty Chair? <a href="/signup">Create account</a>
        </div>

    </div>
</div>
</body>
</html>
