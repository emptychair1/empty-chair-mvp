<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · Empty Chair</title><link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet"><link rel="icon" type="image/png" href="{{ url_for('static', path='/favicon.png') }}"><style>:root{--red:#c62020;--bright:#ed2e2e;--cream:#eee4d1;--muted:#aaa4a0}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(2,2,5,.2),rgba(2,2,5,.4)),url('/static/ChatGPT%20Image%20Aug%2012%2C%202026%2C%2004_44_30%20AM.png') center/cover fixed;color:var(--cream);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.shell{width:100%;max-width:510px}.card{padding:36px 46px;border:1px solid var(--red);border-radius:12px;background:linear-gradient(145deg,rgba(14,14,14,.97),rgba(3,3,3,.98));box-shadow:0 28px 90px #000}.brand{text-align:center;margin-bottom:24px}.brand img{width:100%;max-width:290px}h2{font-family:'UnifrakturCook','Old English Text MT',Georgia,serif;font-size:36px;margin:0 0 8px}.sub{color:var(--muted);line-height:1.5;margin:0 0 24px}.google{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;min-height:54px;border:1px solid #444;border-radius:6px;background:#fff;color:#202124;text-decoration:none;font-weight:700}.google svg{width:20px;height:20px}.divider{display:flex;align-items:center;gap:12px;color:#777;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin:20px 0}.divider:before,.divider:after{content:'';height:1px;background:#333;flex:1}form{display:grid;gap:14px}label{color:var(--bright);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}input{width:100%;min-height:52px;padding:0 15px;border:1px solid #671414;border-radius:6px;background:#0f0f0f;color:#f4eee5;font-size:16px}button{min-height:56px;border:1px solid #ef3939;border-radius:5px;background:linear-gradient(#c82424,#7b0d0d);color:#f5ead9;font-family:'UnifrakturCook','Old English Text MT',Georgia,serif;font-size:25px;cursor:pointer}.error{padding:11px 13px;margin-bottom:16px;border:1px solid #8f1d1d;border-radius:5px;background:rgba(115,15,15,.22);color:#ffaaaa}.links{text-align:center;color:var(--muted);font-size:13px;margin-top:22px;line-height:1.8}.links a{color:var(--bright)}@media(max-width:600px){body{padding:14px}.card{padding:28px 22px}.brand img{max-width:245px}h2{font-size:32px}}</style></head><body><div class="shell"><div class="card"><div class="brand"><img src="{{ url_for('static', path='/empty-chair-logo.png') }}" alt="Empty Chair"></div><h2>Welcome back</h2><p class="sub">Sign in to fill open appointment time.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<a class="google" href="/auth/google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4L15.4 17c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 13.9A6 6 0 0 1 6.1 12c0-.7.1-1.3.3-1.9V7.5H3.1A10 10 0 0 0 2 12c0 1.6.4 3.1 1.1 4.5l3.3-2.6z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-8.9 5.5l3.3 2.6C7.2 7.8 9.4 6 12 6z"/></svg>Continue with Google</a><div class="divider">or use email</div><form method="post" action="/login"><input type="hidden" name="next" value="{{ next or '/' }}"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Log in</button></form><div class="links"><a href="/forgot-password">Forgot password?</a><br>New to Empty Chair? <a href="/signup">Create account</a></div></div></div></body></html>
