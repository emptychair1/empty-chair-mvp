<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Empty Chair</title>

<style>
    :root {
        --bg: #070707;
        --panel: rgba(7, 7, 7, 0.96);
        --panel-2: rgba(14, 14, 14, 0.97);
        --red: #c62020;
        --red-bright: #ed2e2e;
        --red-dark: #6f0909;
        --cream: #eee4d1;
        --muted: #aaa4a0;
        --border: #771414;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 30px 20px;

        background:
            linear-gradient(
                rgba(2, 2, 5, 0.18),
                rgba(2, 2, 5, 0.35)
            ),
            url("/static/ChatGPT%20Image%20Aug%2012%2C%202026%2C%2004_44_30%20AM.png")
            center center / cover no-repeat fixed;

        color: var(--cream);

        font-family:
            Inter,
            ui-sans-serif,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    .auth-shell {
        width: 100%;
        max-width: 510px;
    }

    .card {
        width: 100%;
        padding: 38px 48px 40px;

        border: 1px solid var(--red);
        border-radius: 12px;

        background:
            linear-gradient(
                145deg,
                rgba(14, 14, 14, 0.97),
                rgba(3, 3, 3, 0.98)
            );

        box-shadow:
            0 28px 90px rgba(0, 0, 0, 0.85),
            0 0 0 1px rgba(198, 32, 32, 0.08),
            inset 0 0 40px rgba(0, 0, 0, 0.5);

        backdrop-filter: blur(8px);
    }

    .brand {
        display: flex;
        justify-content: center;
        margin: 0 auto 28px;
    }

    .brand img {
        display: block;
        width: 100%;
        max-width: 300px;
        height: auto;
    }

    h2 {
        margin: 0 0 8px;

        color: var(--cream);

        font-family:
            "UnifrakturCook",
            "UnifrakturMaguntia",
            "Old English Text MT",
            "Lucida Blackletter",
            Georgia,
            serif;

        font-size: 36px;
        line-height: 1;
        font-weight: 700;
    }

    .subtitle {
        margin: 0 0 30px;

        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
    }

    form {
        display: grid;
        gap: 20px;
    }

    label {
        display: grid;
        gap: 8px;

        color: var(--red-bright);

        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    input {
        width: 100%;
        min-height: 54px;

        padding: 0 16px;

        border: 1px solid #671414;
        border-radius: 6px;

        background: rgba(15, 15, 15, 0.95);
        color: #f4eee5;

        font: inherit;
        font-size: 16px;

        transition:
            border-color 0.15s ease,
            box-shadow 0.15s ease,
            background 0.15s ease;
    }

    input:hover {
        border-color: #962020;
    }

    input:focus {
        outline: none;

        border-color: var(--red-bright);

        background: #111;

        box-shadow:
            0 0 0 2px rgba(198, 32, 32, 0.18),
            0 0 22px rgba(198, 32, 32, 0.10);
    }

    button {
        width: 100%;
        min-height: 58px;

        margin-top: 4px;

        border: 1px solid #ef3939;
        border-radius: 5px;

        background:
            linear-gradient(
                180deg,
                #c82424 0%,
                #9e1414 55%,
                #7b0d0d 100%
            );

        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.12),
            0 5px 18px rgba(122, 0, 0, 0.32);

        color: #f5ead9;

        font-family:
            "UnifrakturCook",
            "UnifrakturMaguntia",
            "Old English Text MT",
            "Lucida Blackletter",
            Georgia,
            serif;

        font-size: 26px;
        font-weight: 700;

        cursor: pointer;

        transition:
            filter 0.15s ease,
            transform 0.15s ease;
    }

    button:hover {
        filter: brightness(1.15);
        transform: translateY(-1px);
    }

    button:active {
        transform: translateY(1px);
    }

    .error {
        padding: 12px 14px;

        border: 1px solid #8f1d1d;
        border-radius: 5px;

        background: rgba(115, 15, 15, 0.22);
        color: #ffaaaa;

        font-size: 14px;
    }

    .links {
        margin-top: 25px;

        display: grid;
        gap: 12px;

        text-align: center;

        color: var(--muted);
        font-size: 14px;
    }

    .links a {
        color: var(--red-bright);
        text-decoration-color: rgba(237, 46, 46, 0.55);
        text-underline-offset: 3px;
    }

    .links a:hover {
        color: #ff5555;
    }

    @media (max-width: 600px) {
        body {
            padding: 16px;
            background-position: center center;
        }

        .card {
            padding: 30px 25px 32px;
        }

        .brand img {
            max-width: 260px;
        }

        h2 {
            font-size: 32px;
        }
    }
</style>
<link
    href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap"
    rel="stylesheet"
>
<link
    rel="icon"
    type="image/png"
    href="{{ url_for('static', path='/favicon.png') }}"
>
</head>
<body>
<div class="auth-shell">
    <div class="card">

        <div class="brand">
            <img src="{{ url_for('static', path='/empty-chair-logo.png') }}"
                 alt="Empty Chair">
        </div>

        <h2>Welcome back</h2>
        <p class="sub">Sign in to manage openings and recover empty chairs.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next or '/' }}">

            <label for="email">Email</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" required autofocus>

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button type="submit">Log in</button>
        </form>

        <div class="links">
            <a href="/forgot-password">Forgot password?</a><br>
            New to Empty Chair? <a href="/signup">Create account</a>
        </div>

    </div>
</div>
</body>
</html>
