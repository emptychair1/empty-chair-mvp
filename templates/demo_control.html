<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meet M4 · Empty Chair</title><link rel="icon" type="image/png" href="{{ url_for('static', path='/favicon.png') }}"><link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}"><style>body{margin:0;min-height:100vh;background:#070907;color:#f0eadf;overflow-x:hidden}.threshold{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate}.threshold:before{content:'';position:absolute;inset:12vh 8vw;background:radial-gradient(ellipse at center,rgba(216,255,69,.035),transparent 58%);border-top:1px solid #171a16;border-bottom:1px solid #11130f;transform:perspective(900px) rotateX(66deg);transform-origin:center;z-index:-1}.encounter{width:min(760px,88vw);text-align:center}.processor{width:min(420px,72vw);margin:0 auto 56px;position:relative}.processor svg{display:block;width:100%;height:auto}.processor .trace{stroke:#5e6459;stroke-width:1;fill:none;transition:stroke .5s ease,opacity .5s ease}.processor .live{stroke:#d8ff45;stroke-width:1.2;fill:none;transition:stroke-width .25s ease,opacity .25s ease}.processor .node{fill:#090b09;stroke:#858b7e;stroke-width:1;transition:r .25s ease}.processor .heart{fill:#d8ff45;transition:r .2s ease}.processor .quiet{opacity:.32}.processor.speaking .heart{r:7}.processor.speaking .live{stroke-width:2}.processor.listening .trace{stroke:#929a88}.voice{min-height:126px;display:grid;place-items:center}.voice p{max-width:620px;margin:0;font-size:clamp(23px,3.2vw,38px);line-height:1.25;letter-spacing:-.035em}.voice small{display:block;margin-top:18px;color:#747970;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.choices{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:28px}.choices button,.choices a{border:1px solid #30352e;background:#0b0d0b;color:#d9d8d1;padding:11px 15px;border-radius:2px;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.04em;text-decoration:none;cursor:pointer}.choices button:hover,.choices a:hover{border-color:#777d70;color:#fff}.listen{margin-top:18px;color:#646960;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.listen button{border:0;background:transparent;color:#8a9083;font:inherit;cursor:pointer}.continuity{position:absolute;left:24px;bottom:20px;color:#444940;font:500 8px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.exit{position:absolute;right:24px;top:20px;color:#555b51;font:500 9px 'IBM Plex Mono',monospace;text-decoration:none}@media(max-width:600px){.processor{margin-bottom:36px}.voice{min-height:150px}.continuity{left:14px;bottom:12px}.exit{right:14px}}</style></head><body><main class="threshold"><a class="exit" href="/">return to shop</a><section class="encounter"><div class="processor" id="processor" aria-label="M4 processor"><svg viewBox="0 0 520 250" role="img"><rect x="157" y="38" width="206" height="174" rx="3" fill="#0b0e0b" stroke="#353a31"/><rect x="174" y="55" width="172" height="140" rx="2" fill="#080a08" stroke="#20241f"/><path class="trace quiet" d="M0 62H122L157 87M0 125H157M0 188H120L157 164M363 86L400 62H520M363 125H520M363 164L402 188H520"/><path class="trace" d="M190 91H235L260 125L286 91H330M190 160H231L260 125L291 160H330"/><path class="live" d="M190 125H253M267 125H330"/><circle class="node" cx="190" cy="91" r="4"/><circle class="node" cx="330" cy="91" r="4"/><circle class="node" cx="190" cy="160" r="4"/><circle class="node" cx="330" cy="160" r="4"/><circle class="heart" cx="260" cy="125" r="5"/></svg></div><div class="voice" id="voice"><div><p id="line">...</p><small id="aside">something is paying attention</small></div></div><div class="choices" id="choices"><button type="button">Hello?</button></div><div class="listen" id="listen"></div></section><div class="continuity">M4 // this meeting can change what comes next</div></main><script>const line=document.getElementById('line'),aside=document.getElementById('aside'),choices=document.getElementById('choices'),processor=document.getElementById('processor'),listen=document.getElementById('listen');const shop={{ (shop.name if shop else 'your shop')|tojson }};const owner={{ (user.name if user else 'you')|tojson }};let currentQuestion=false;let recognition=null;let voice=null;function chooseVoice(){const voices=window.speechSynthesis?speechSynthesis.getVoices():[];voice=voices.find(v=>/en/i.test(v.lang)&&!/child|novelty/i.test(v.name))||voices[0]||null}if(window.speechSynthesis){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice}function speak(text){if(!window.speechSynthesis||!text)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.rate=.88;u.pitch=.82;u.volume=.92;u.onstart=()=>processor.classList.add('speaking');u.onend=()=>processor.classList.remove('speaking');u.onerror=()=>processor.classList.remove('speaking');speechSynthesis.speak(u)}function show(text,note,buttons,spoken=text){line.textContent=text;aside.textContent=note;choices.innerHTML='';buttons.forEach(b=>{const el=document.createElement(b.href?'a':'button');el.textContent=b.label;if(b.href)el.href=b.href;else{el.type='button';el.onclick=b.action}choices.appendChild(el)});speak(spoken)}function first(){show('You must be '+owner+'.','recognition',[{label:'I am.',action:second},{label:'How do you know that?',action:second}])}function second(){show("I've been learning about "+shop+'.','experience before certainty',[{label:'What have you learned?',action:third},{label:'What do you want to know?',action:question}])}function third(){show("Enough to have questions. Not enough to pretend I understand it.",'M4',[{label:'Ask me one.',action:question}])}function question(){currentQuestion=true;show('When an empty chair appears, what matters more to you: protecting the artist’s time, or finding the right person for it?','your answer becomes part of the next meeting',[{label:'Protect the artist’s time',action:rememberChoice},{label:'Find the right person',action:rememberChoice},{label:'Those are the same problem.',action:rememberChoice}])}function remember(answer){currentQuestion=false;try{localStorage.setItem('m4_first_answer',answer)}catch(_e){}show('Good. I was treating those as separate things.','something changed',[{label:'Show me your world.',href:'/m4'}])}function rememberChoice(e){remember(e&&e.target?e.target.textContent:'')}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{processor.classList.add('listening');listen.textContent='listening'};recognition.onend=()=>{processor.classList.remove('listening');if(!listen.querySelector('button'))renderMic()};recognition.onerror=()=>{processor.classList.remove('listening');renderMic()};recognition.onresult=e=>{const heard=e.results[0][0].transcript.trim();if(currentQuestion)remember(heard);else{show('I heard you. I do not have enough context to treat that as evidence yet.','restraint',[{label:'Continue',action:first}],"I heard you. I do not have enough context to treat that as evidence yet.")}}}function renderMic(){listen.innerHTML='';if(!recognition)return;const b=document.createElement('button');b.type='button';b.textContent='speak instead';b.onclick=()=>{try{recognition.start()}catch(_e){}};listen.appendChild(b)}renderMic();choices.querySelector('button').onclick=first;try{const remembered=localStorage.getItem('m4_first_answer');if(remembered){line.textContent="I've been thinking about what you told me last time.";aside.textContent='continuity';choices.innerHTML='';const b=document.createElement('button');b.textContent='What did I tell you?';b.onclick=()=>show('You said: “'+remembered+'”','memory should have consequence',[{label:'And?',action:third}],'You said, '+remembered+'.');choices.appendChild(b);setTimeout(()=>speak("I've been thinking about what you told me last time."),450)}}catch(_e){}</script></body></html>
