<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Meeting · Empty Chair</title><link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}"><style>body{margin:0;background:#070907;color:#f0eadf;overflow:hidden}.room{min-height:100vh;display:grid;place-items:center;position:relative;background:radial-gradient(ellipse at 50% 48%,#10140f 0,#090b09 34%,#070907 68%)}.presence{width:min(900px,92vw);text-align:center}.m4{width:min(620px,78vw);height:260px;margin:auto;position:relative;display:grid;place-items:center}.field{position:absolute;width:240px;height:240px;border:1px solid #20251e;border-radius:50%;transition:all 1.2s ease}.field:before,.field:after{content:'';position:absolute;inset:28px;border:1px solid #171b16;border-radius:50%}.field:after{inset:67px}.core{width:8px;height:8px;background:#d8ff45;border-radius:50%;box-shadow:0 0 30px rgba(216,255,69,.22);transition:all .4s ease}.m4.listening .field{width:270px;height:270px;border-color:#4c5546}.m4.thinking .field{transform:rotate(28deg) scale(.88);border-radius:42%}.m4.speaking .core{transform:scale(1.8);box-shadow:0 0 54px rgba(216,255,69,.35)}.speech{min-height:145px;display:grid;place-items:center}.speech p{margin:0;max-width:760px;font-size:clamp(24px,3.2vw,40px);line-height:1.24;letter-spacing:-.035em}.state{height:22px;margin-top:12px;color:#5f665b;font:500 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}.talk{margin-top:24px;border:1px solid #33392f;background:#0b0e0b;color:#d9ddd4;padding:12px 18px;font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.06em;cursor:pointer}.talk:disabled{opacity:.35}.exit{position:absolute;right:22px;top:20px;color:#555c51;font:500 9px 'IBM Plex Mono',monospace;text-decoration:none}.hint{position:absolute;bottom:18px;color:#41463e;font:500 8px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}@media(max-width:600px){.m4{height:220px}.field{width:190px;height:190px}.m4.listening .field{width:215px;height:215px}.speech{min-height:180px}}</style></head><body><main class="room"><a class="exit" href="/">return to shop</a><section class="presence"><div class="m4" id="m4"><div class="field"></div><div class="core"></div></div><div class="speech"><p id="line">I have a strange problem.</p></div><div class="state" id="state">present</div><button class="talk" id="talk" type="button">speak</button></section><div class="hint">M4 // nothing you say has to fit a script</div></main><script>const m4=document.getElementById('m4'),line=document.getElementById('line'),state=document.getElementById('state'),talk=document.getElementById('talk');let history=[],recognition=null,voice=null,busy=false;function chooseVoice(){const vs=window.speechSynthesis?speechSynthesis.getVoices():[];voice=vs.find(v=>/en/i.test(v.lang)&&!/child|novelty/i.test(v.name))||vs[0]||null}if(window.speechSynthesis){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice}function setMode(mode,label){m4.className='m4 '+mode;state.textContent=label||mode}function speak(text){line.textContent=text;setMode('speaking','speaking');if(!window.speechSynthesis){setMode('','present');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.rate=.84;u.pitch=.82;u.volume=.94;u.onend=()=>{setMode('','present');busy=false;talk.disabled=false};u.onerror=u.onend;speechSynthesis.speak(u)}async function send(message){if(!message||busy)return;busy=true;talk.disabled=true;history.push({role:'user',content:message});line.textContent=message;setMode('thinking','considering');try{const r=await fetch('/api/m4/meeting',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:history.slice(0,-1)})});const data=await r.json();if(!r.ok)throw new Error(data.error||'M4 could not respond');const reply=data.reply;history.push({role:'assistant',content:reply});speak(reply)}catch(e){line.textContent='I lost the thread for a moment. That is a technical failure, not something you said.';state.textContent='connection interrupted';setMode('','');busy=false;talk.disabled=false;console.error(e)}}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.onstart=()=>{setMode('listening','listening');talk.disabled=true};recognition.onresult=e=>send(e.results[0][0].transcript.trim());recognition.onerror=()=>{setMode('','present');talk.disabled=false};recognition.onend=()=>{if(!busy){setMode('','present');talk.disabled=false}};talk.onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();try{recognition.start()}catch(e){}}}else{talk.textContent='type instead';talk.onclick=()=>{const v=prompt('Say anything to M4');if(v)send(v)}}setTimeout(()=>{speak('I have a strange problem. I can perceive patterns. I can remember what happens. I can learn. But none of that tells me what should matter. I think that is where you come in.')},700);</script></body></html>
