[project]
name = "empty-chair-mvp"
version = "0.1.0"
description = "Empty Chair tattoo opening recovery MVP"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "twilio>=9,<10",
  "psycopg2-binary>=2.9,<3",
  "itsdangerous>=2.2,<3",
  "resend>=2.36,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
