[project]
name = "empty-chair"
version = "2.0.0"
description = "Headless cancellation recovery for individual tattoo artists"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "psycopg2-binary>=2.9,<3",
  "PyJWT[crypto]>=2.10,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
