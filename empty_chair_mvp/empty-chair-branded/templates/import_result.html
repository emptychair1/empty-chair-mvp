<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import Complete · Empty Chair</title>
<link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body class="inner-page">
<div class="inner-wrap" style="max-width:760px;">
  <div class="inner-top">
    <a class="inner-brand" href="/"><img src="{{ url_for('static', path='/empty-chair-logo.png') }}" alt="Empty Chair"></a>
    <a class="inner-back" href="/">← Dashboard</a>
  </div>

  <section class="hero-panel">
    <div class="hero-kicker">Import Complete</div>
    <h1 class="hero-heading">Customer Data Loaded</h1>

    <div class="metric-grid" style="grid-template-columns:repeat(3,1fr);margin-top:22px;">
      <div class="metric-card" style="grid-template-columns:1fr;min-height:120px;"><div class="metric-label">New</div><div class="metric-value">{{ imported }}</div></div>
      <div class="metric-card" style="grid-template-columns:1fr;min-height:120px;"><div class="metric-label">Updated</div><div class="metric-value">{{ updated }}</div></div>
      <div class="metric-card" style="grid-template-columns:1fr;min-height:120px;"><div class="metric-label">Skipped</div><div class="metric-value">{{ skipped }}</div></div>
    </div>

    {% if errors %}
    <div class="panel" style="margin-top:18px;">
      <div class="panel-head"><h2 class="panel-title">Rows Needing Attention</h2></div>
      <div style="color:var(--cream-dim);line-height:1.65;">
        {% for error in errors[:50] %}<div>{{ error }}</div>{% endfor %}
      </div>
    </div>
    {% endif %}

    <div class="hero-actions">
      <a class="button" href="/import/customers">Import Another CSV</a>
      <a class="button secondary" href="/">Back to Dashboard</a>
    </div>
  </section>
</div>
</body>
</html>
